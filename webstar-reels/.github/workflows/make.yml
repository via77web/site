name: Make

# Actions → Make → Run workflow: brief → concept site → Vercel preview → four reels → review issue.
on:
  workflow_dispatch:
    inputs:
      brief:
        description: One-line brief, e.g. "A mobile dog groomer in Melbourne's south-east"
        type: string
        required: true
      brand:
        description: Brand
        type: choice
        options: [webstar, via77]
      placeholders:
        description: Use placeholder images instead of generating them
        type: boolean
        default: false
      dry_run:
        description: Build and render, but don't deploy, save or send anything
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: reels-state
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          npm ci
          npx playwright install --with-deps chromium
          npx remotion browser ensure

      - name: Make
        # Inputs go through env, never straight into the shell.
        run: npm run make -- "$BRIEF" --brand "$BRAND" ${{ inputs.placeholders && '--placeholders' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          BRIEF: ${{ inputs.brief }}
          BRAND: ${{ inputs.brand }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
          ELEVENLABS_VOICE_ID_WEBSTAR: ${{ secrets.ELEVENLABS_VOICE_ID_WEBSTAR }}
          ELEVENLABS_VOICE_ID_VIA77: ${{ secrets.ELEVENLABS_VOICE_ID_VIA77 }}
          GH_TOKEN: ${{ github.token }}

      - name: Keep the site and reels as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: make
          path: |
            out/*/*/*.mp4
            out/sites/
            !out/*/*/*-recording*.mp4
          if-no-files-found: ignore
          retention-days: 14

      - name: Save state
        if: always() && !inputs.dry_run
        run: |
          if [ -n "$(git status --porcelain -- brands)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add brands
            git commit -m "Add batch for review"
            git pull --rebase
            git push
          fi
