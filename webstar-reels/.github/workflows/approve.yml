name: Approve

# Comment /approve all, /approve full detail, or /reject on a review issue.
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: reels-state
  cancel-in-progress: false

jobs:
  decide:
    # Only review issues, only people with a role on the repo, only comments with a command.
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'reel-review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (contains(github.event.comment.body, '/approve') || contains(github.event.comment.body, '/reject'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Record the decision and schedule
        run: npm run approve -- --issue ${{ github.event.issue.number }}
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_PROFILE_IDS_WEBSTAR: ${{ secrets.BUFFER_PROFILE_IDS_WEBSTAR }}
          BUFFER_PROFILE_IDS_VIA77: ${{ secrets.BUFFER_PROFILE_IDS_VIA77 }}
          BUFFER_ACCESS_TOKEN_VIA77: ${{ secrets.BUFFER_ACCESS_TOKEN_VIA77 }}
          GH_TOKEN: ${{ github.token }}

      - name: Save state
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- brands)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add brands
            git commit -m "Record approval for #${{ github.event.issue.number }}"
            git pull --rebase
            git push
          fi
