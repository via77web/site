name: Daily reel

on:
  schedule:
    # GitHub cron is UTC. 22:00 UTC = 9:00am AEDT (UTC+11, October to April).
    # During AEST (UTC+10, April to October) this runs at 8:00am. The 6pm post time is unaffected.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Render the reels but do not post
        type: boolean
        default: false
      brand:
        description: Only run this brand (blank = every brand in brands/)
        type: string
        default: ""

permissions:
  contents: write # commit the queues, upload reels to releases

concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          npm ci
          npx playwright install --with-deps chromium
          npx remotion browser ensure

      # One reel per brand in brands/. Brands run independently: if one fails the others
      # still post, and the job is marked failed at the end so you get the notification.
      - name: Make and schedule today's reels
        run: npm run reel -- ${{ inputs.dry_run && '--dry-run' || '' }} ${ONLY_BRAND:+--brand "$ONLY_BRAND"}
        env:
          ONLY_BRAND: ${{ inputs.brand }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          # Per brand. Adding a brand means adding its two secrets here.
          ELEVENLABS_VOICE_ID_WEBSTAR: ${{ secrets.ELEVENLABS_VOICE_ID_WEBSTAR }}
          BUFFER_PROFILE_IDS_WEBSTAR: ${{ secrets.BUFFER_PROFILE_IDS_WEBSTAR }}
          ELEVENLABS_VOICE_ID_VIA77: ${{ secrets.ELEVENLABS_VOICE_ID_VIA77 }}
          BUFFER_PROFILE_IDS_VIA77: ${{ secrets.BUFFER_PROFILE_IDS_VIA77 }}
          BUFFER_ACCESS_TOKEN_VIA77: ${{ secrets.BUFFER_ACCESS_TOKEN_VIA77 }}
          GH_TOKEN: ${{ github.token }}

      - name: Keep the reels as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reels
          path: |
            out/*/*/*-day-*.mp4
            out/*/*/script.json
            out/*/*/caption.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Save queue status
        if: always()
        run: |
          if ! git diff --quiet -- brands; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add brands
            git commit -m "Update reel queues"
            git push
          fi
