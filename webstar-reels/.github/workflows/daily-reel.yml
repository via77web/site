name: Daily reel

on:
  schedule:
    # GitHub cron is UTC. 22:00 UTC = 9:00am AEDT (UTC+11, October to April).
    # During AEST (UTC+10, April to October) this runs at 8:00am. The 6pm post time is unaffected.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Render the reel but do not post
        type: boolean
        default: false

permissions:
  contents: write # commit sites.json, upload the reel to a release

concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          npm ci
          npx playwright install --with-deps chromium
          npx remotion browser ensure

      - name: Make and schedule today's reel
        run: npm run reel -- ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_PROFILE_IDS: ${{ secrets.BUFFER_PROFILE_IDS }}
          GH_TOKEN: ${{ github.token }}

      - name: Keep the reel as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: |
            out/*/day-*.mp4
            out/*/script.json
            out/*/caption.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Save queue status
        if: always()
        run: |
          if ! git diff --quiet sites.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sites.json
            git commit -m "Update reel queue"
            git push
          fi
